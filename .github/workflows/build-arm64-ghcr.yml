name: Build arm64 images to GHCR
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  OWNER: syvineckruyk

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - svc: api
            file: apps/api/Dockerfile
          - svc: web
            file: apps/web/Dockerfile
          - svc: ingest
            file: apps/ingest/Dockerfile
          - svc: otel-collector
            file: otel/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_BASE_URL=http://10.0.1.40:3472
            VITE_MAPLE_AUTH_MODE=self_hosted
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/maple-${{ matrix.svc }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/maple-${{ matrix.svc }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}
